[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "icuhub"
version = "0.0.1"
description = "Standalone integration hub: connectors, credential broker, action policy, audit, OCSF/SARIF normalization"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
# Runtime dependencies: ADR-0016 (HTTP toolkit), ADR-0019 (JMESPath), ADR-0021 (service stack).
dependencies = [
  "icuhub-schemas==0.0.1",
  "httpx2==2.16.0",
  "tenacity==9.2.1",
  "aiolimiter==1.3.0",
  "authlib==1.9.5",
  "asyncpg==0.32.0",
  "jmespath==1.1.0",
  "defusedxml==0.7.1",
  "cryptography==50.0.2",
  "fastapi==0.162.2",
  "uvicorn==0.54.0",
  "sqlalchemy[asyncio]==2.1.8",
  "alembic==1.20.1",
  "aiokafka==0.15.0",
  "mcp==2.3.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "pytest>=8",
  "packaging>=24",  # PEP 508 marker evaluation in tools/license_check.py
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
icuhub = ["connectors/**/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "BLE",  # flake8-blind-except
  "N",    # pep8-naming
  "PLC",  # pylint convention
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["icuhub", "icuhub_schemas", "license_check"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
