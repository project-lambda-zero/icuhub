name: Bug report
description: Report a defect (security issues go to Security Advisories, see SECURITY.md)
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: "api / mcp / hooks / policy / connector:<kind> / worker / schemas"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
