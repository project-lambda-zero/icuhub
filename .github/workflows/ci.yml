name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]" -e packages/icuhub-schemas
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src packages tools
      - name: Tests
        run: python -m pytest -q packages/icuhub-schemas/tests tests
      - name: License check
        run: python tools/license_check.py
