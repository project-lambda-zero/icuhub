name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m ruff check .
      - name: Compile
        run: python -m compileall -q src
      - name: Tests
        # Exit code 5 means no tests were collected (Phase 0, no runtime code yet).
        run: |
          set +e
          python -m pytest -q
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi
