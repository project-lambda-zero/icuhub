apiVersion: v1
kind: ServiceAccount
metadata:
  name: icuhub-runtime
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: icuhub-runtime
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: icuhub-runtime
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
subjects:
  - kind: ServiceAccount
    name: icuhub-runtime
    namespace: icuhub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: icuhub-runtime
