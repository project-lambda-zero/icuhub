apiVersion: apps/v1
kind: Deployment
metadata:
  name: icuhub-worker
  namespace: icuhub
  labels:
    app.kubernetes.io/name: icuhub
    app.kubernetes.io/part-of: icuhub
    app.kubernetes.io/component: worker
spec:
  # Workers claim jobs with FOR UPDATE SKIP LOCKED, so replicas coordinate through Postgres.
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: icuhub
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icuhub
        app.kubernetes.io/part-of: icuhub
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: icuhub-runtime
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: icuhub
          # No ports and no Service: the worker exposes no HTTP surface, and the code has no health endpoint.
          # Liveness is process-level only; no probe is declared (see docs/OPENSHIFT_RUNTIME.md).
          # --relay publishes outbox batches to Kafka from the long-running loop (requires the Kafka settings).
          command: ["python", "-m", "icuhub", "worker", "--relay"]
          envFrom:
            - configMapRef:
                name: icuhub-config
          env:
            - name: ICUHUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: icuhub-runtime-db
                  key: database-url
          # Unmeasured estimates; tune from observed usage before production sizing.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: openbao-token
              mountPath: /var/run/icuhub/runtime
              readOnly: true
            - name: kafka-ca
              mountPath: /var/run/icuhub/kafka
              readOnly: true
            - name: kafka-sasl
              mountPath: /var/run/icuhub/kafka-sasl
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: openbao-token
          secret:
            secretName: icuhub-openbao
            # 0440 (decimal 288): group read for the fsGroup assigned by the restricted SCC.
            defaultMode: 288
            items:
              - key: openbao-token
                path: openbao-token
        - name: kafka-ca
          secret:
            secretName: icuhub-kafka-ca
            defaultMode: 288
            items:
              - key: ca.pem
                path: ca.pem
        - name: kafka-sasl
          secret:
            secretName: icuhub-kafka-sasl
            defaultMode: 288
            items:
              - key: username
                path: username
              - key: password
                path: password
