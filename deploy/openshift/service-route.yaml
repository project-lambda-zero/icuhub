apiVersion: v1
kind: Service
metadata:
  name: icuhub-api
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: icuhub
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: icuhub
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
    app.kubernetes.io/component: api
spec:
  host: icuhub.apps.example.com
  to:
    kind: Service
    name: icuhub-api
    weight: 100
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
