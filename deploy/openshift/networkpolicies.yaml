# Namespace selectors use kubernetes.io/metadata.name, which is set automatically on every namespace.
# Placeholder namespaces (icuhub-postgres, kafka, openbao, smtp) must match the target cluster; see docs.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Only the API receives traffic, and only from the OpenShift router. The worker has no ingress rule.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-ingress-from-router
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: icuhub
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              policy-group.network.openshift.io/ingress: ""
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Applies to every runtime pod, including the migration Job. Replace the namespace with the Postgres location.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-egress
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: icuhub-postgres
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openbao-egress
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["api", "worker"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openbao
      ports:
        - protocol: TCP
          port: 8200
---
# Outbox relay only: the worker publishes outbox batches (--relay). The API does not publish to Kafka.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-egress
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kafka
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smtp-egress
  namespace: icuhub
  labels:
    app.kubernetes.io/part-of: icuhub
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: ["api", "worker"]
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: smtp
      ports:
        - protocol: TCP
          port: 587
