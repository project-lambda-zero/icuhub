apiVersion: batch/v1
kind: Job
metadata:
  name: icuhub-migrate
  namespace: icuhub
  labels:
    app.kubernetes.io/name: icuhub
    app.kubernetes.io/part-of: icuhub
    app.kubernetes.io/component: migrate
spec:
  # Recreate before each install: delete the prior Job, apply, then wait for completion (see docs).
  backoffLimit: 2
  activeDeadlineSeconds: 900
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: icuhub
        app.kubernetes.io/part-of: icuhub
        app.kubernetes.io/component: migrate
    spec:
      serviceAccountName: icuhub-runtime
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: icuhub
          # Exact argv: the dispatcher accepts only ["migrate"] with no extra arguments.
          command: ["python", "-m", "icuhub", "migrate"]
          envFrom:
            - configMapRef:
                name: icuhub-config
          env:
            # Owner role: migrations create the SECURITY DEFINER functions and need owner privileges.
            - name: ICUHUB_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: icuhub-migrate-db
                  key: database-url
          # Unmeasured estimates; tune from observed usage before production sizing.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
